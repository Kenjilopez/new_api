<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Axios for API calls -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto px-4 py-8">
        <!-- Auth Section -->
        <div id="authSection" class="mb-8">
            <div id="loginForm" class="bg-white p-6 rounded-lg shadow-md max-w-md mx-auto">
                <h2 class="text-2xl font-bold mb-4">Login / Register</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-gray-700">Email</label>
                        <input type="email" id="email" class="w-full p-2 border rounded">
                    </div>
                    <div>
                        <label class="block text-gray-700">Password</label>
                        <input type="password" id="password" class="w-full p-2 border rounded">
                    </div>
                    <div class="flex space-x-4">
                        <button onclick="login()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Login</button>
                        <button onclick="register()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Register</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cars Section -->
        <div id="carsSection" class="hidden">
            <div class="bg-white p-6 rounded-lg shadow-md mb-8">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-2xl font-bold">Cars Management</h2>
                    <button onclick="showAddCarForm()" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Add New Car</button>
                </div>
                
                <!-- Add Car Form -->
                <div id="addCarForm" class="hidden mb-4 p-4 border rounded">
                    <h3 class="text-xl font-bold mb-2">Add New Car</h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block text-gray-700">Model</label>
                            <input type="text" id="carModel" class="w-full p-2 border rounded">
                        </div>
                        <div>
                            <label class="block text-gray-700">Store ID</label>
                            <input type="text" id="storeId" class="w-full p-2 border rounded">
                        </div>
                        <div class="flex space-x-4">
                            <button onclick="addCar()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">Save</button>
                            <button onclick="hideAddCarForm()" class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">Cancel</button>
                        </div>
                    </div>
                </div>

                <!-- Cars List -->
                <div id="carsList" class="grid gap-4">
                    <!-- Cars will be loaded here -->
                </div>
            </div>

            <!-- Logout Button -->
            <button onclick="logout()" class="bg-red-500 text-white px-4 py-2 rounded hover:bg-red-600">Logout</button>
        </div>
    </div>

    <script>
        // Global variables
        let token = localStorage.getItem('token');
        const API_URL = 'http://127.0.0.1:5000';

        // Check if user is logged in
        function checkAuth() {
            if (token) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('carsSection').classList.remove('hidden');
                loadCars();
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('carsSection').classList.add('hidden');
            }
        }

        // Authentication functions
        async function login() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await axios.post(`${API_URL}/login`, {
                    email: email,
                    password: password
                });
                token = response.data.access_token;
                localStorage.setItem('token', token);
                checkAuth();
                alert('Login successful!');
            } catch (error) {
                alert(error.response?.data?.error || 'Login failed');
            }
        }

        async function register() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const response = await axios.post(`${API_URL}/registry`, {
                    email: email,
                    password: password
                });
                alert('Registration successful! Please login.');
            } catch (error) {
                alert(error.response?.data?.error || 'Registration failed');
            }
        }

        function logout() {
            token = null;
            localStorage.removeItem('token');
            checkAuth();
        }

        // Cars management functions
        async function loadCars() {
            try {
                const response = await axios.get(`${API_URL}/cars`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                displayCars(response.data);
            } catch (error) {
                if (error.response?.status === 401) {
                    logout();
                }
                console.error('Error loading cars:', error);
            }
        }

        function displayCars(cars) {
            const carsList = document.getElementById('carsList');
            carsList.innerHTML = '';

            cars.forEach(car => {
                const carElement = document.createElement('div');
                carElement.className = 'border p-4 rounded-lg shadow';
                carElement.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div>
                            <h3 class="font-bold">${car.model}</h3>
                            <p class="text-gray-600">Store ID: ${car.store_id}</p>
                        </div>
                        <div class="space-x-2">
                            <button onclick="deleteCar(${car.id})" class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600">Delete</button>
                        </div>
                    </div>
                `;
                carsList.appendChild(carElement);
            });
        }

        function showAddCarForm() {
            document.getElementById('addCarForm').classList.remove('hidden');
        }

        function hideAddCarForm() {
            document.getElementById('addCarForm').classList.add('hidden');
            document.getElementById('carModel').value = '';
            document.getElementById('storeId').value = '';
        }

        async function addCar() {
            const model = document.getElementById('carModel').value;
            const storeId = document.getElementById('storeId').value;

            try {
                await axios.post(`${API_URL}/cars`, {
                    model: model,
                    store_id: storeId
                }, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                hideAddCarForm();
                loadCars();
                alert('Car added successfully!');
            } catch (error) {
                alert(error.response?.data?.error || 'Failed to add car');
            }
        }

        async function deleteCar(id) {
            if (!confirm('Are you sure you want to delete this car?')) return;

            try {
                await axios.delete(`${API_URL}/cars/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                loadCars();
                alert('Car deleted successfully!');
            } catch (error) {
                alert(error.response?.data?.error || 'Failed to delete car');
            }
        }

        // Initialize the app
        checkAuth();
    </script>
</body>
</html>
