<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Axios for API calls -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- Toastify for notifications -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <style>
        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spinner {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        /* Component Styles */
        .modal-backdrop {
            transition: opacity 0.3s ease-in-out;
            backdrop-filter: blur(5px);
        }
        .modal-content {
            animation: fadeIn 0.3s ease-out;
        }
        .car-card {
            transition: all 0.3s ease;
            animation: fadeIn 0.5s ease-out;
        }
        .car-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .loader {
            border-top-color: #3498db;
            animation: spinner 1.5s linear infinite;
        }
        .btn-primary {
            transition: all 0.3s ease;
            background-size: 200% auto;
            background-image: linear-gradient(to right, #4F46E5 0%, #6366F1 50%, #4F46E5 100%);
        }
        .btn-primary:hover {
            background-position: right center;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .auth-card {
            animation: fadeIn 0.5s ease-out;
        }
        .input-field {
            transition: all 0.3s ease;
        }
        .input-field:focus {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-100 to-gray-200 min-h-screen">
    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden z-50 flex items-center justify-center">
        <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12"></div>
    </div>

    <div class="container mx-auto px-4 py-8">
        <!-- Auth Section -->
        <div id="authSection" class="mb-8">
            <div class="max-w-md mx-auto pt-10">
                <div class="auth-card bg-white p-8 rounded-xl shadow-2xl">
                    <div class="text-center mb-8">
                        <svg class="w-20 h-20 mx-auto mb-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
                                d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
                            </path>
                        </svg>
                        <h2 class="text-3xl font-bold text-gray-800 mb-2">Welcome Back</h2>
                        <p class="text-gray-600">Sign in to manage your car inventory</p>
                    </div>
                    <div class="space-y-6">
                        <div>
                            <label class="block text-gray-700 text-sm font-medium mb-2">
                                <span class="flex items-center">
                                    <svg class="w-5 h-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                            d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z">
                                        </path>
                                    </svg>
                                    Username
                                </span>
                            </label>
                            <input type="text" id="username" 
                                class="input-field w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                placeholder="Enter your username">
                        </div>
                        <div>
                            <label class="block text-gray-700 text-sm font-medium mb-2">
                                <span class="flex items-center">
                                    <svg class="w-5 h-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                            d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                                        </path>
                                    </svg>
                                    Password
                                </span>
                            </label>
                            <input type="password" id="password" 
                                class="input-field w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                                placeholder="Enter your password">
                            <label class="block mt-4 text-gray-700 text-sm font-medium">
                                <span class="flex items-center">
                                    <svg class="w-5 h-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                            d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z">
                                        </path>
                                    </svg>
                                    Role
                                </span>
                            </label>
                            <select id="role" class="input-field w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                                <option value="client">Client</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                        <div class="space-y-4 pt-2">
                            <button onclick="login()" 
                                class="btn-primary w-full py-3 px-4 rounded-lg text-white font-medium hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                                <span class="flex items-center justify-center">
                                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                            d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1">
                                        </path>
                                    </svg>
                                    Sign In
                                </span>
                            </button>
                            <button onclick="register()" 
                                class="w-full py-3 px-4 rounded-lg text-gray-700 font-medium border-2 border-gray-300 hover:bg-gray-50 hover:border-gray-400 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-all">
                                <span class="flex items-center justify-center">
                                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z">
                                        </path>
                                    </svg>
                                    Create Account
                                </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Cars Section -->
        <div id="carsSection" class="hidden">
            <!-- Header -->
            <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
                <div class="flex flex-col lg:flex-row justify-between items-center space-y-4 lg:space-y-0">
                    <div>
                        <div class="flex items-center">
                            <svg class="w-10 h-10 text-indigo-600 mr-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
                                    d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                    d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"></path>
                            </svg>
                            <div>
                                <h1 class="text-3xl font-bold text-gray-800">Car Management System</h1>
                                <p class="text-gray-600 mt-1">Manage your car inventory efficiently</p>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <button onclick="showAddCarModal()" 
                            class="btn-primary flex items-center px-6 py-3 rounded-lg text-white font-medium hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                            Add New Car
                        </button>
                        <button onclick="logout()" 
                            class="flex items-center px-6 py-3 rounded-lg text-red-600 font-medium border-2 border-red-200 hover:bg-red-50 hover:border-red-300 transition-colors duration-300 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1">
                                </path>
                            </svg>
                            Logout
                        </button>
                    </div>
                </div>
            </div>

            <!-- Cars Grid -->
            <div id="carsList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Cars will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Add/Edit Car Modal -->
    <div id="carModal" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40">
        <div class="flex items-center justify-center min-h-screen px-4">
            <div class="bg-white rounded-lg shadow-xl max-w-md w-full transform transition-all">
                <div class="flex justify-between items-center p-6 border-b">
                    <h3 id="modalTitle" class="text-xl font-semibold text-gray-900">Add New Car</h3>
                    <button onclick="hideCarModal()" class="text-gray-400 hover:text-gray-500">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                        </svg>
                    </button>
                </div>
                <div class="p-6 space-y-4">
                    <input type="hidden" id="carId">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Car Model</label>
                        <input type="text" id="carModel" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Store ID</label>
                        <input type="text" id="storeId" class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                <div class="flex justify-end space-x-4 p-6 border-t">
                    <button onclick="hideCarModal()" class="px-4 py-2 border rounded-lg hover:bg-gray-50">
                        Cancel
                    </button>
                    <button onclick="saveCar()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700">
                        Save Changes
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

    <script>
        // Global variables
        let token = localStorage.getItem('token');
        const API_URL = window.location.origin;

        // Add axios interceptor for handling token expiration
        axios.interceptors.response.use(
            response => response,
            error => {
                if (error.response?.status === 401) {
                    // Token might be expired
                    showToast('Session expired. Please login again', 'error');
                    logout();
                }
                return Promise.reject(error);
            }
        );

        // Utility functions
        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function showToast(message, type = 'success') {
            Toastify({
                text: message,
                duration: 3000,
                gravity: "top",
                position: "right",
                backgroundColor: type === 'success' ? "#10B981" : "#EF4444",
            }).showToast();
        }

        // Check if user is logged in
        function checkAuth() {
            if (token) {
                document.getElementById('authSection').classList.add('hidden');
                document.getElementById('carsSection').classList.remove('hidden');
                loadCars();
            } else {
                document.getElementById('authSection').classList.remove('hidden');
                document.getElementById('carsSection').classList.add('hidden');
            }
        }

        // Authentication functions
        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                showToast('Please enter both username and password', 'error');
                return;
            }

            try {
                showLoading();
                const response = await axios.post(`${API_URL}/auth/login`, {
                    username: username,
                    password: password
                });
                
                token = response.data.token;
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(response.data.user));
                checkAuth();
                showToast('Login successful!');
            } catch (error) {
                console.error('Login error:', error);
                showToast(error.response?.data?.error || 'Login failed. Please check your credentials.', 'error');
            } finally {
                hideLoading();
            }
        }

        async function register() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role')?.value || 'client';

            if (!username || !password) {
                showToast('Please enter both username and password', 'error');
                return;
            }

            try {
                showLoading();
                const response = await axios.post(`${API_URL}/auth/register`, {
                    username: username,
                    password: password,
                    role: role
                });

                token = response.data.token;
                localStorage.setItem('token', token);
                localStorage.setItem('user', JSON.stringify(response.data.user));
                checkAuth();
                showToast('Registration successful!');
            } catch (error) {
                showToast(error.response?.data?.error || 'Registration failed', 'error');
            } finally {
                hideLoading();
            }
        }

        function logout() {
            token = null;
            localStorage.removeItem('token');
            checkAuth();
            showToast('Logged out successfully');
        }

        // Cars management functions
        async function loadCars() {
            if (!token) {
                showToast('Please login first', 'error');
                return;
            }

            try {
                showLoading();
                const config = {
                    headers: { 'Authorization': `Bearer ${token}` }
                };
                
                const response = await axios.get(`${API_URL}/cars`, config);
                
                if (response.status === 200 && Array.isArray(response.data)) {
                    displayCars(response.data);
                } else {
                    throw new Error('Invalid response format');
                }
            } catch (error) {
                console.error('Load cars error:', error);
                if (error.response?.status === 401) {
                    showToast('Session expired. Please login again', 'error');
                    logout();
                } else {
                    showToast(error.response?.data?.error || 'Error loading cars', 'error');
                }
            } finally {
                hideLoading();
            }
        }

        function displayCars(cars) {
            const carsList = document.getElementById('carsList');
            carsList.innerHTML = '';

            if (cars.length === 0) {
                carsList.innerHTML = `
                    <div class="col-span-3 text-center py-12">
                        <svg class="mx-auto h-12 w-12 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"></path>
                        </svg>
                        <h3 class="mt-4 text-lg font-medium text-gray-900">No cars found</h3>
                        <p class="mt-1 text-gray-500">Get started by adding a new car to your inventory.</p>
                        <button onclick="showAddCarModal()" 
                            class="mt-6 btn-primary inline-flex items-center px-6 py-3 rounded-lg text-white font-medium hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2">
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                            Add New Car
                        </button>
                    </div>
                `;
                return;
            }

            cars.forEach(car => {
                const carElement = document.createElement('div');
                carElement.className = 'car-card bg-white rounded-xl shadow-md overflow-hidden hover:shadow-xl';
                carElement.innerHTML = `
                    <div class="p-6">
                        <div class="flex items-center justify-between mb-6">
                            <div class="flex items-center">
                                <svg class="w-8 h-8 text-indigo-600 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"></path>
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                        d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0m6 0a2 2 0 104 0m-4 0a2 2 0 114 0"></path>
                                </svg>
                                <h3 class="text-xl font-semibold text-gray-800">${car.model}</h3>
                            </div>
                            <span class="px-4 py-1.5 bg-indigo-100 text-indigo-800 rounded-full text-sm font-medium inline-flex items-center">
                                <svg class="w-4 h-4 mr-1.5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                        d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4">
                                    </path>
                                </svg>
                                Store ${car.store_id}
                            </span>
                        </div>
                        <div class="flex justify-end space-x-3">
                            <button onclick="editCar(${car.id}, '${car.model}', '${car.store_id}')" 
                                class="inline-flex items-center px-4 py-2 bg-yellow-500 text-white rounded-lg hover:bg-yellow-600 transition-colors focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:ring-offset-2">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                        d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z">
                                    </path>
                                </svg>
                                Edit
                            </button>
                            <button onclick="confirmDeleteCar(${car.id})" 
                                class="inline-flex items-center px-4 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition-colors focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                        d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16">
                                    </path>
                                </svg>
                                Delete
                            </button>
                        </div>
                    </div>
                `;
                carsList.appendChild(carElement);
            });
        }

        // Modal management
        function showAddCarModal() {
            document.getElementById('modalTitle').textContent = 'Add New Car';
            document.getElementById('carId').value = '';
            document.getElementById('carModel').value = '';
            document.getElementById('storeId').value = '';
            document.getElementById('carModal').classList.remove('hidden');
        }

        function showEditCarModal(id, model, storeId) {
            document.getElementById('modalTitle').textContent = 'Edit Car';
            document.getElementById('carId').value = id;
            document.getElementById('carModel').value = model;
            document.getElementById('storeId').value = storeId;
            document.getElementById('carModal').classList.remove('hidden');
        }

        function hideCarModal() {
            document.getElementById('carModal').classList.add('hidden');
        }

        function editCar(id, model, storeId) {
            showEditCarModal(id, model, storeId);
        }

        async function saveCar() {
            const id = document.getElementById('carId').value;
            const model = document.getElementById('carModel').value;
            const storeId = document.getElementById('storeId').value;

            if (!model || !storeId) {
                showToast('Please fill in all fields', 'error');
                return;
            }

            if (!token) {
                showToast('Please login first', 'error');
                return;
            }

            try {
                showLoading();
                const config = {
                    headers: { 'Authorization': `Bearer ${token}` }
                };
                
                if (id) {
                    // Update existing car
                    const response = await axios.put(
                        `${API_URL}/cars/${id}`,
                        { model: model, store_id: storeId },
                        config
                    );
                    
                    if (response.status === 200) {
                        showToast('Car updated successfully');
                    } else {
                        throw new Error('Failed to update car');
                    }
                } else {
                    // Add new car
                    const response = await axios.post(
                        `${API_URL}/cars`,
                        { model: model, store_id: storeId },
                        config
                    );
                    
                    if (response.status === 201) {
                        showToast('Car added successfully');
                    } else {
                        throw new Error('Failed to add car');
                    }
                }
                hideCarModal();
                await loadCars();
            } catch (error) {
                console.error('Save car error:', error);
                if (error.response?.status === 401) {
                    showToast('Session expired. Please login again', 'error');
                    logout();
                } else {
                    showToast(error.response?.data?.error || 'Operation failed', 'error');
                }
            } finally {
                hideLoading();
            }
        }

        function confirmDeleteCar(id) {
            if (confirm('Are you sure you want to delete this car?')) {
                deleteCar(id);
            }
        }

        async function deleteCar(id) {
            if (!token) {
                showToast('Please login first', 'error');
                return;
            }

            try {
                showLoading();
                const response = await axios.delete(`${API_URL}/cars/${id}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 200) {
                    showToast('Car deleted successfully');
                    await loadCars();
                } else {
                    throw new Error('Failed to delete car');
                }
            } catch (error) {
                console.error('Delete car error:', error);
                if (error.response?.status === 401) {
                    showToast('Session expired. Please login again', 'error');
                    logout();
                } else if (error.response?.status === 403) {
                    showToast('You do not have permission to delete this car', 'error');
                } else {
                    showToast(error.response?.data?.error || 'Failed to delete car', 'error');
                }
            } finally {
                hideLoading();
            }
        }

        // Initialize the app
        checkAuth();
    </script>
</body>
</html>
